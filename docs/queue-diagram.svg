<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- background -->
  <rect width="1000" height="460" fill="#FAFAFA"/>

  <defs>
    <!-- sprinkler / drip emitter icon (zone valves) -->
    <g id="sprinkler" stroke-linecap="round" stroke-linejoin="round">
      <!-- ground stake -->
      <line x1="0" y1="-2" x2="0" y2="14" stroke="#37474F" stroke-width="2.2"/>
      <polygon points="-2.5,12 2.5,12 0,18" fill="#37474F"/>
      <!-- horizontal feed tube -->
      <line x1="-9" y1="2" x2="9" y2="2" stroke="#263238" stroke-width="1.6"/>
      <circle cx="9" cy="2" r="1.6" fill="#263238"/>
      <!-- emitter cap -->
      <circle cx="0" cy="-4" r="3.2" fill="#2196F3" stroke="#0D47A1" stroke-width="0.6"/>
      <!-- water sprays (fanning out) -->
      <g stroke="#64B5F6" stroke-width="1.4" fill="none" opacity="0.9">
        <path d="M -10 -7 Q -7 -10 -4 -8"/>
        <path d="M -5 -12 L -3 -8"/>
        <path d="M 0 -13 L 0 -8"/>
        <path d="M 5 -12 L 3 -8"/>
        <path d="M 10 -7 Q 7 -10 4 -8"/>
      </g>
    </g>

    <!-- master valve / faucet icon -->
    <g id="master-icon" stroke-linecap="round" stroke-linejoin="round">
      <!-- main horizontal pipe -->
      <rect x="-12" y="3" width="24" height="6" rx="1" fill="#455A64"/>
      <!-- vertical stem -->
      <rect x="-2.5" y="-7" width="5" height="10" fill="#0D47A1"/>
      <!-- valve handle -->
      <circle cx="0" cy="-9" r="4" fill="#1565C0" stroke="#0D47A1" stroke-width="0.6"/>
      <!-- handle T-bar -->
      <line x1="-5" y1="-9" x2="5" y2="-9" stroke="#0D47A1" stroke-width="1.4"/>
      <!-- water flow arrows (subtle, both sides) -->
      <g stroke="#42A5F5" stroke-width="1.3" fill="none" opacity="0.85">
        <path d="M -18 6 L -14 6" marker-end="url(#flow)"/>
        <path d="M 14 6 L 18 6" marker-end="url(#flow)"/>
      </g>
    </g>

    <marker id="flow" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#42A5F5"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="500" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#212121">
    How the queue serializes simultaneous requests
  </text>
  <text x="500" y="68" text-anchor="middle" font-size="14" fill="#616161">
    Three open commands arrive at t = 0. The queue runs them one at a time, with a pause between to recover pressure.
  </text>

  <!-- "all 3 requested at t=0" annotation -->
  <g font-size="12" fill="#607D8B">
    <text x="226" y="100">all 3 requested at t = 0</text>
    <line x1="222" y1="105" x2="222" y2="380" stroke="#CFD8DC" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Row icons (left of labels, won't overlap text) -->
  <use href="#master-icon" transform="translate(60, 145)"/>
  <use href="#sprinkler" transform="translate(60, 210)"/>
  <use href="#sprinkler" transform="translate(60, 280)"/>
  <use href="#sprinkler" transform="translate(60, 350)"/>

  <!-- Row labels -->
  <g font-size="14" font-weight="500" fill="#212121" text-anchor="end">
    <text x="200" y="150">Master valve</text>
    <text x="200" y="220">Valve 1</text>
    <text x="200" y="290">Valve 2</text>
    <text x="200" y="360">Valve 3</text>
  </g>

  <!-- Background tracks (closed = empty channel) -->
  <g fill="#ECEFF1">
    <rect x="220" y="135" width="715" height="32" rx="6"/>
    <rect x="220" y="205" width="715" height="32" rx="6"/>
    <rect x="220" y="275" width="715" height="32" rx="6"/>
    <rect x="220" y="345" width="715" height="32" rx="6"/>
  </g>

  <!-- Master valve: open during each zone's run, closed during pauses -->
  <g fill="#0D47A1">
    <rect x="220" y="135" width="180" height="32" rx="6"/>
    <rect x="455" y="135" width="180" height="32" rx="6"/>
    <rect x="690" y="135" width="180" height="32" rx="6"/>
  </g>
  <g font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="600">
    <text x="310" y="156">open</text>
    <text x="545" y="156">open</text>
    <text x="780" y="156">open</text>
  </g>

  <!-- Valve 1: opens immediately -->
  <rect x="220" y="205" width="180" height="32" rx="6" fill="#1E88E5"/>
  <text x="310" y="226" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="600">open</text>

  <!-- Valve 2: pending then open -->
  <rect x="220" y="275" width="235" height="32" rx="6" fill="#FFB300"/>
  <rect x="455" y="275" width="180" height="32" rx="6" fill="#1E88E5"/>
  <text x="337" y="296" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="600">pending</text>
  <text x="545" y="296" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="600">open</text>

  <!-- Valve 3: pending longer then open -->
  <rect x="220" y="345" width="470" height="32" rx="6" fill="#FFB300"/>
  <rect x="690" y="345" width="180" height="32" rx="6" fill="#1E88E5"/>
  <text x="455" y="366" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="600">pending</text>
  <text x="780" y="366" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="600">open</text>

  <!-- Pause indicators -->
  <g stroke="#90A4AE" stroke-dasharray="2 3" stroke-width="1">
    <line x1="400" y1="125" x2="400" y2="390"/>
    <line x1="455" y1="125" x2="455" y2="390"/>
    <line x1="635" y1="125" x2="635" y2="390"/>
    <line x1="690" y1="125" x2="690" y2="390"/>
  </g>
  <g font-size="11" fill="#607D8B" text-anchor="middle">
    <text x="427" y="405">pause</text>
    <text x="662" y="405">pause</text>
  </g>

  <!-- Time axis -->
  <line x1="220" y1="420" x2="935" y2="420" stroke="#B0BEC5" stroke-width="1"/>
  <g font-size="11" fill="#607D8B">
    <text x="220" y="435" text-anchor="middle">t = 0</text>
    <text x="310" y="435" text-anchor="middle">V1 duration</text>
    <text x="545" y="435" text-anchor="middle">V2 duration</text>
    <text x="780" y="435" text-anchor="middle">V3 duration</text>
    <text x="935" y="435" text-anchor="end">→ time</text>
  </g>

  <!-- Legend -->
  <g transform="translate(180, 455)" font-size="13" fill="#424242">
    <rect x="0" y="-12" width="22" height="14" rx="3" fill="#0D47A1"/>
    <text x="32" y="0">master open</text>

    <rect x="170" y="-12" width="22" height="14" rx="3" fill="#1E88E5"/>
    <text x="202" y="0">valve open</text>

    <rect x="320" y="-12" width="22" height="14" rx="3" fill="#FFB300"/>
    <text x="352" y="0">valve pending (queued)</text>

    <rect x="540" y="-12" width="22" height="14" rx="3" fill="#ECEFF1" stroke="#CFD8DC"/>
    <text x="572" y="0">closed</text>
  </g>
</svg>
