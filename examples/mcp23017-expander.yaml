# ESPHome configuration for a custom irrigation board using an MCP23017 I/O expander.
#
# Hardware:
#   - Generic ESP32 dev board (e.g., ESP32-DevKitC, NodeMCU-ESP32)
#   - MCP23017 16-channel I2C GPIO expander at address 0x20
#   - One MCP23017 pin per relay (8 zones + 1 master = 9 used)
#   - Active-LOW relays (typical for opto-isolated relay banks)
#
# Wiring:
#   ESP GPIO21 (SDA) -> MCP SDA
#   ESP GPIO22 (SCL) -> MCP SCL
#   ESP 3.3V         -> MCP VCC
#   ESP GND          -> MCP GND, MCP A0/A1/A2 (address 0x20), MCP RESET high

esphome:
  name: villa-sprinkler
  friendly_name: "Villa Sprinkler"

esp32:
  board: esp32dev

logger:
api:
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source: github://cristoforocervino/esp32-sprinkler-queue
    components: [sprinkler_queue]

i2c:
  sda: GPIO21
  scl: GPIO22

mcp23017:
  - id: io_exp
    address: 0x20

sprinkler_queue:
  pause_between_valves:
    initial_value: 8
    mode: box

  master_valve:
    pin: { mcp23xxx: io_exp, number: 0, mode: OUTPUT, inverted: true }

  valves:
    - name: "Zone 1"
      pin: { mcp23xxx: io_exp, number: 1, mode: OUTPUT, inverted: true }
      initial_duration: 300
    - name: "Zone 2"
      pin: { mcp23xxx: io_exp, number: 2, mode: OUTPUT, inverted: true }
      initial_duration: 300
    - name: "Zone 3"
      pin: { mcp23xxx: io_exp, number: 3, mode: OUTPUT, inverted: true }
      initial_duration: 300
    - name: "Zone 4"
      pin: { mcp23xxx: io_exp, number: 4, mode: OUTPUT, inverted: true }
      initial_duration: 300
    - name: "Zone 5"
      pin: { mcp23xxx: io_exp, number: 5, mode: OUTPUT, inverted: true }
      initial_duration: 300
    - name: "Zone 6"
      pin: { mcp23xxx: io_exp, number: 6, mode: OUTPUT, inverted: true }
      initial_duration: 300
    - name: "Zone 7"
      pin: { mcp23xxx: io_exp, number: 7, mode: OUTPUT, inverted: true }
      initial_duration: 300
    - name: "Zone 8"
      pin: { mcp23xxx: io_exp, number: 8, mode: OUTPUT, inverted: true }
      initial_duration: 300
