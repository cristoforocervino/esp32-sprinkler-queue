# ESPHome configuration for the AliExpress 16-channel ESP32 relay board
# https://it.aliexpress.com/item/1005007479415609.html
#
# Hardware:
#   - ESP32-WROOM-32E onboard
#   - 12V DC power input (drives both ESP32 via onboard buck and relay coils)
#   - Two chained 74HC595 shift registers controlling 16 relays
#   - Pin mapping: LATCH=GPIO12, CLOCK=GPIO13, DATA=GPIO14, OE=GPIO5
#   - Active-HIGH relays (inverted: false)
#
# Layout:
#   Channel 0  -> master valve (auto-opens with any zone)
#   Channels 1-15 -> 15 zone valves
#
# Programming requires a 3.3V USB-to-TTL adapter (FT232RL or similar) on the
# UART header (BOOT/IO0 + EN buttons).

esphome:
  name: garden-sprinkler
  friendly_name: "Garden Sprinkler"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
api:
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source: github://cristoforocervino/esp32-sprinkler-queue
    components: [sprinkler_queue]

# Two chained 74HC595s -> 16 virtual GPIO pins
sn74hc595:
  - id: relay_chain
    type: gpio
    data_pin: GPIO14
    clock_pin: GPIO13
    latch_pin: GPIO12
    oe_pin: GPIO5
    sr_count: 2

sprinkler_queue:
  pause_between_valves:
    initial_value: 5
    mode: box

  master_valve:
    pin: { sn74hc595: relay_chain, number: 0, inverted: false }

  valves:
    - name: "Valve 1"
      pin: { sn74hc595: relay_chain, number: 1, inverted: false }
      initial_duration: 300
    - name: "Valve 2"
      pin: { sn74hc595: relay_chain, number: 2, inverted: false }
      initial_duration: 300
    - name: "Valve 3"
      pin: { sn74hc595: relay_chain, number: 3, inverted: false }
      initial_duration: 300
    - name: "Valve 4"
      pin: { sn74hc595: relay_chain, number: 4, inverted: false }
      initial_duration: 300
    - name: "Valve 5"
      pin: { sn74hc595: relay_chain, number: 5, inverted: false }
      initial_duration: 300
    - name: "Valve 6"
      pin: { sn74hc595: relay_chain, number: 6, inverted: false }
      initial_duration: 300
    - name: "Valve 7"
      pin: { sn74hc595: relay_chain, number: 7, inverted: false }
      initial_duration: 300
    - name: "Valve 8"
      pin: { sn74hc595: relay_chain, number: 8, inverted: false }
      initial_duration: 300
    - name: "Valve 9"
      pin: { sn74hc595: relay_chain, number: 9, inverted: false }
      initial_duration: 300
    - name: "Valve 10"
      pin: { sn74hc595: relay_chain, number: 10, inverted: false }
      initial_duration: 300
    - name: "Valve 11"
      pin: { sn74hc595: relay_chain, number: 11, inverted: false }
      initial_duration: 300
    - name: "Valve 12"
      pin: { sn74hc595: relay_chain, number: 12, inverted: false }
      initial_duration: 300
    - name: "Valve 13"
      pin: { sn74hc595: relay_chain, number: 13, inverted: false }
      initial_duration: 300
    - name: "Valve 14"
      pin: { sn74hc595: relay_chain, number: 14, inverted: false }
      initial_duration: 300
    - name: "Valve 15"
      pin: { sn74hc595: relay_chain, number: 15, inverted: false }
      initial_duration: 300
